name: macOS preview release

on:
  workflow_dispatch:
  push:
    branches: [macos-release]

permissions:
  contents: read

concurrency:
  group: macos-preview-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run build
      - name: Check native anti-AFK events without posting input
        run: |
          clang -fobjc-arc src-tauri/native/tests/afk_test.m -framework Cocoa -framework ApplicationServices -framework AVFoundation -o /tmp/roalt-afk-test
          /tmp/roalt-afk-test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build --bundles app
      - name: Package and verify
        run: |
          set -euo pipefail
          app=src-tauri/target/release/bundle/macos/RoALT.app
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist" | grep -q "voice chat"
          codesign --force --deep --sign - --identifier com.inspectsoftware.roalt "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p release-macos
          ditto -c -k --sequesterRsrc --keepParent "$app" release-macos/RoALT-macOS-Apple-Silicon.zip
          cp docs/MACOS_PORT.md release-macos/MACOS_README.md
          cp docs/MACOS_FEATURE_AUDIT.md release-macos/MACOS_FEATURE_AUDIT.md
          cd release-macos
          shasum -a 256 RoALT-macOS-Apple-Silicon.zip > SHA256SUMS.txt
          unzip -t RoALT-macOS-Apple-Silicon.zip
      - name: Publish Mac preview download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          tag="macos-preview-${version}-${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<'NOTES'
          Apple Silicon macOS preview. Download RoALT-macOS-Apple-Silicon.zip, unzip it, and drag RoALT.app into Applications.

          This app is ad-hoc signed, not Developer ID signed or notarized. macOS may require approval to open the app and access Keychain. Grant Accessibility, Screen Recording and Input Monitoring when needed.

          Updated to the Windows v1.2.301 source baseline (5923226), with the native Apple Silicon backend retained.
          - New upstream interface, themes, settings search, account/group profiles, social tools, custom flags, launch/rejoin fixes and Discord options.
          - Mac profile-aware CPU planning, corrected minimized-window detection, bounded previews and native window-layout adapters.
          - Replay recording, modpack application and protected embedded browsing remain unavailable. Clip-library management and modpack-library management are available.
          - Windows memory trimming, hard quotas, affinity, per-client GPU/audio controls, default-launcher registration and the Windows watchdog are not ported.
          - Export an encrypted backup before upgrading: the newer database schema is not readable by older builds.

          Read docs/MACOS_FEATURE_AUDIT.md in this release's source for the full command/settings inventory and manual acceptance checklist. Automated build/tests do not establish real Roblox idle prevention or performance savings. Intel Macs are not supported.

          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its assets unchanged."
          else
            gh release create "$tag" release-macos/* --target "$GITHUB_SHA" --prerelease --title "RoALT $version — macOS preview" --notes-file release-notes.md
          fi
